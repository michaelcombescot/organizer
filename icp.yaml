canisters:
  # Canisters which needs to be deployed
  - name: Admin
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  - name: Factory
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  - name: RegistryIndexes
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  # Canisters dynamically created
  - name: IndexMain
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  - name: SearchIndexes
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  - name: BucketUsers
    recipe:
      type: "@dfinity/motoko@v5.1.0"

  # Frontend asset canister
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.0"
      configuration:
        dir: ./frontend
        source: dist
        build:
          - npm install
          - npm run build

networks:
  - name: local
    mode: managed
    ii: true